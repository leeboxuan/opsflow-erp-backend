services:
  - type: web
    name: opsflow-erp-backend
    env: node
    plan: starter
    buildCommand: pnpm install --frozen-lockfile && pnpm prisma:generate && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_VERSION
        value: 20
      # Database (Supabase session pooler)
      - key: DATABASE_URL
        sync: false
      # Supabase Auth (required for JWT verification and admin APIs)
      - key: SUPABASE_PROJECT_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Optional: for legacy HS256 JWTs (Supabase JWT secret from project settings)
      - key: SUPABASE_JWT_SECRET
        sync: false
      # CORS: comma-separated origins (e.g. https://opsflow-erp-web.onrender.com)
      - key: WEB_APP_URLS
        sync: false
      # Job message import (OpenAI). Required in production.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_JOB_IMPORT_MODEL
        sync: false
      - key: OPENAI_JOB_IMPORT_TIMEOUT_MS
        sync: false
